# The template asks for 8 GB, far more than this small app needs; on a machine
# short of memory that much can crash the build (and whatever else is running).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Plugin sources live in the pub cache on C: while the project is on D:, and
# Kotlin's incremental caches break on sources from another drive, failing
# the build ("Could not close incremental caches").
kotlin.incremental=false
